<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1f27" />
    <title>Autun 3D</title>
    <style>
      /* Style « affiche » (D17) : encre, crème, rouge brique, ocre ; toute l'interface en jeu les reprend (D102). */
      :root { --ink: #1b1f27; --cream: #fff8e6; --brick: #d9472b; --ochre: #f1b24a; --panel: rgba(27, 31, 39, .72); --lift: 0 3px 0 rgba(27, 31, 39, .45); }
      html, body { margin: 0; height: 100%; background: #1b1f27; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      canvas { display: block; width: 100%; height: 100%; }
      #debug { position: fixed; top: 204px; left: 6px; padding: 4px 8px; font: 12px/1.35 ui-monospace, monospace; color: #e8e8e8;
               background: rgba(0, 0, 0, .55); border-radius: 4px; white-space: pre; pointer-events: none; display: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #e8e8e8; font: 16px system-ui, sans-serif; }
      #touch { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; display: none; }
      body.game #touch { display: block; }
      #stick-base, #stick-knob { position: fixed; display: none; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
      #stick-base { width: 116px; height: 116px; box-sizing: border-box; background: rgba(27, 31, 39, .35); border: 2px solid rgba(255, 248, 230, .7); }
      #stick-knob { width: 52px; height: 52px; box-sizing: border-box; background: rgba(255, 248, 230, .85); border: 2px solid var(--cream); box-shadow: var(--lift); }
      #hint { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center; color: #fff; font: 14px system-ui, sans-serif;
              text-shadow: 0 1px 4px #000; pointer-events: none; opacity: 0; transition: opacity .6s; }
      body.game #hint { animation: hint 9s ease-out 0.5s both; }
      @keyframes hint { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
      /* Pédales (D104), sous le pouce droit : accélérateur haut et étroit (cerclé d'ocre), frein large (rouge brique), frein à main au-dessus
         du frein (voiture seulement), klaxon ou sonnette en bouton rond à gauche. Chacune : pictogramme et mot (le klaxon : pictogramme seul). */
      #pedals { position: fixed; right: 0; bottom: 0; width: 310px; height: 190px; display: none; z-index: 4; pointer-events: none; }
      body.game.driving #pedals { display: block; }
      .pedal { position: absolute; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 5px; color: var(--cream); box-sizing: border-box; text-align: center;
               font: 800 14px/1.05 system-ui, sans-serif; border-radius: 22px; border: 2.5px solid var(--cream); background: var(--panel); box-shadow: var(--lift); }
      #gas { right: max(14px, env(safe-area-inset-right)); bottom: 16px; width: 98px; height: 156px; border-color: var(--ochre); }
      #gas .ico { font-size: 34px; color: var(--ochre); }
      #brake { right: calc(max(14px, env(safe-area-inset-right)) + 110px); bottom: 16px; width: 100px; height: 96px; background: rgba(217, 71, 43, .78); }
      #brake .ico { font-size: 28px; }
      #handbrake { right: calc(max(14px, env(safe-area-inset-right)) + 110px); bottom: 122px; width: 100px; height: 48px; flex-direction: row; gap: 6px; border-radius: 16px;
                   font-size: 12px; text-align: left; display: none; }
      #handbrake .ico { font-size: 22px; color: var(--ochre); }
      body.car #handbrake { display: flex; }
      #horn { right: calc(max(14px, env(safe-area-inset-right)) + 222px); bottom: 26px; width: 58px; height: 58px; border-radius: 50%; border-width: 2px; }
      #horn .ico { font-size: 26px; }
      .pedal.on { transform: translateY(2px); box-shadow: 0 1px 0 rgba(27, 31, 39, .45); filter: brightness(1.35); }
      .ico { display: block; width: 1em; height: 1em; }
      /* Bouton d'action : en véhicule (« Descendre »), une pastille au-dessus des pédales. */
      #action { position: fixed; right: 14px; bottom: 186px; z-index: 4; display: none; padding: 12px 18px; border-radius: 14px;
                border: 2px solid var(--cream); background: rgba(217, 71, 43, .9); color: var(--cream); font: 800 16px system-ui, sans-serif; box-shadow: var(--lift); }
      body.game #action.show { display: block; }
      /* En véhicule (D104), « Descendre » est une petite pastille en haut à droite, loin des pédales. */
      body.game.driving #action.show { top: 8px; bottom: auto; right: max(10px, env(safe-area-inset-right)); height: 46px; padding: 0 16px 0 12px; border-radius: 23px; border-width: 1.5px;
                background: var(--panel); display: flex; align-items: center; gap: 6px; font: 700 13px system-ui, sans-serif; }
      body.game.driving #action .ico { font-size: 20px; }
      /* À pied (D103), le groupe du pouce droit : gros bouton rond d'attaque, bouton d'action rond à sa gauche (Monter, Prendre, Ramasser : pictogramme
         et verbe), petit bouton de rechargement au-dessus quand une arme à feu est en main. */
      body.game:not(.driving) #action.show { right: 134px; bottom: 42px; width: 78px; height: 78px; padding: 0; border-radius: 50%; background: var(--panel);
                display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 800 11px/1 system-ui, sans-serif; letter-spacing: -.01em; }
      #action .ico { font-size: 28px; }
      #action:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(27, 31, 39, .45); }
      #attack { position: fixed; right: 26px; bottom: 30px; width: 96px; height: 96px; box-sizing: border-box; z-index: 4; display: none; touch-action: none; user-select: none; -webkit-user-select: none;
                place-items: center; border-radius: 50%; border: 3px solid var(--cream); background: rgba(217, 71, 43, .82); color: var(--cream);
                font-size: 46px; box-shadow: 0 5px 0 rgba(27, 31, 39, .5); }
      body.game:not(.driving) #attack { display: grid; }
      #attack.on { background: var(--brick); transform: translateY(3px); box-shadow: 0 2px 0 rgba(27, 31, 39, .5); }
      #reload { position: fixed; right: 118px; bottom: 136px; width: 52px; height: 52px; padding: 0; z-index: 4; display: none; place-items: center; border-radius: 50%;
                border: 2px solid var(--cream); background: var(--panel); color: var(--cream); font-size: 24px; box-shadow: var(--lift); touch-action: manipulation; }
      body.game.gun:not(.driving) #reload { display: grid; }
      #reload:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(27, 31, 39, .45); }
      /* Réticule de la visée assistée (J5-3) : un anneau crème qui suit la cible de l'arme à feu. */
      #reticle { position: fixed; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; z-index: 3; display: none; pointer-events: none; border-radius: 50%;
                 border: 3px solid #fff8e6; box-shadow: 0 0 0 2px rgba(27, 31, 39, .55), inset 0 0 0 2px rgba(27, 31, 39, .35); }
      #reticle::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #d9472b; }
      #credits { position: fixed; right: 6px; bottom: 4px; font: 10px system-ui, sans-serif; color: rgba(255,255,255,.7);
                 text-shadow: 0 0 3px #000; pointer-events: none; max-width: 70%; text-align: right; }
      body.game #credits { display: none; }

      /* Compteur (D104) : petit cadran accolé en bas à droite de la minimap (en bas au centre, il cachait le véhicule) ; l'heure se décale à gauche. */
      #speedo { position: fixed; left: calc(max(10px, env(safe-area-inset-left)) + 100px); top: 96px; width: 72px; height: 72px; z-index: 5; display: none; pointer-events: none; }
      body.game.driving #speedo { display: block; }
      body.driving #hint { display: none; }
      body.driving #clock { left: calc(max(10px, env(safe-area-inset-left)) + 24px); }
      #speedo svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
      #speedo .disc { fill: var(--ink); stroke: var(--cream); stroke-width: 2; }
      #speedo .track, #speedo #speedo-arc { fill: none; stroke-width: 5; stroke-linecap: butt; }
      #speedo .track { stroke: rgba(255, 248, 230, .22); }
      #speedo #speedo-arc { stroke: var(--ochre); stroke-dasharray: 0 100; }
      #speedo #speedo-arc.red { stroke: var(--brick); }
      #speedo-value { position: absolute; left: 0; right: 0; top: 22px; text-align: center; color: var(--cream); font: 800 22px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
      #speedo-unit { position: absolute; left: 0; right: 0; top: 46px; text-align: center; color: var(--ochre); font: 700 9px/1 system-ui, sans-serif; letter-spacing: .05em; }
      /* Figure en cours (roue arrière, roue avant) : sous la minimap. */
      #stunt { position: fixed; left: calc(max(10px, env(safe-area-inset-left)) + 8px); top: 174px; z-index: 4; pointer-events: none; padding: 4px 10px; border-radius: 12px;
               background: rgba(27, 31, 39, .78); border: 1.5px solid var(--ochre); color: var(--ochre); font: 800 12px/1.2 system-ui, sans-serif; white-space: nowrap; }
      #stunt:empty { display: none; }
      [hidden] { display: none !important; }
      /* Interface en jeu (D102) : minimap et horloge en haut à gauche (un appui sur la minimap ouvre la carte, qui est l'écran de pause),
         bandeau santé / arme / recherche en haut au centre. Rien ne touche le joystick (gauche, bas) ni les pédales (droite, bas). */
      #minimap { position: fixed; left: max(10px, env(safe-area-inset-left)); top: 8px; width: 140px; height: 140px; z-index: 4; display: none; border-radius: 50%; cursor: pointer;
                 touch-action: none; -webkit-tap-highlight-color: transparent; }
      #clock { position: fixed; left: calc(max(10px, env(safe-area-inset-left)) + 36px); top: 132px; width: 68px; height: 24px; box-sizing: border-box; z-index: 4; display: none; place-items: center; pointer-events: none;
               border-radius: 12px; border: 1.5px solid var(--cream); background: var(--ink); color: var(--cream); font: 700 14px/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
      body.game #minimap, body.minimap-on #minimap { display: block; }
      body.game #clock { display: grid; }
      /* Bandeau d'état « plaque émaillée » : double filet crème et ocre ; chaque partie n'apparaît que quand elle sert, le bandeau disparaît s'il est vide. */
      #status { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 4; display: none; align-items: stretch; height: 44px; padding: 0 4px; box-sizing: border-box;
                border-radius: 22px; border: 2px solid var(--cream); background: rgba(27, 31, 39, .86); white-space: nowrap; pointer-events: none;
                box-shadow: inset 0 0 0 2px rgba(27, 31, 39, .86), inset 0 0 0 3px rgba(241, 178, 74, .7), 0 3px 0 rgba(27, 31, 39, .5); color: var(--cream); font: 600 14px system-ui, sans-serif; }
      #status:has(> .slot.on) { display: flex; }
      body.driving #weapon { display: none !important; }
      body.driving #status:not(:has(> #health.on, > #wanted.on)) { display: none; }
      .slot { position: relative; display: none; align-items: center; gap: 7px; padding: 0 12px; }
      .slot.on { display: flex; }
      /* Filet entre deux parties visibles (l'arme est cachée en véhicule). */
      #status > .slot.on ~ .slot.on::after { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 1.5px; background: rgba(255, 248, 230, .3); }
      body.driving #health:not(.on) ~ #wanted::after { display: none; }
      /* Étoiles de recherche (J4) : étoile pleine rouge brique cerclée de crème pour le niveau atteint, contour pâle au-delà ; cachées sans étoile. */
      #wanted { gap: 2px; padding: 0 8px 0 10px; }
      #wanted .wstar { display: block; width: 21px; height: 21px; }
      #wanted .wstar svg { width: 100%; height: 100%; display: block; overflow: visible; }
      #wanted .wstar circle { display: none; }
      #wanted .wstar path { fill: none; stroke: rgba(255, 248, 230, .4); stroke-width: 1.5; stroke-linejoin: round; }
      #wanted .wstar.full path { fill: var(--brick); stroke: var(--cream); }
      #wanted.lost .wstar.full { animation: wlost 1.1s ease-in-out infinite; }
      @keyframes wlost { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      #wanted.rise .wstar.full { animation: wrise .5s ease-out 2; }
      @keyframes wrise { 0% { transform: scale(1.45); } 100% { transform: scale(1); } }
      /* Santé (J5) : cœur dans une pastille rouge brique, jauge crème découpée en segments ; cachée à santé pleine, rouge brique et pulsante sous 30 %. */
      #health { padding-left: 6px; }
      #health .hicon { width: 26px; height: 26px; }
      #health .hicon svg { width: 100%; height: 100%; display: block; overflow: visible; }
      #health .hicon circle { fill: var(--brick); stroke: var(--cream); stroke-width: 1.5; }
      #health .hicon path { fill: var(--cream); transform: scale(.58); transform-origin: 12px 12px; }
      #health .hbar { position: relative; width: 80px; height: 12px; border-radius: 3px; background: rgba(255, 248, 230, .16); overflow: hidden; }
      #health .hbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 7px, var(--ink) 7px 8px); }
      #health .hfill { display: block; height: 100%; width: 100%; background: var(--cream); }
      #health.low .hfill { background: var(--brick); }
      #health.low .hicon { animation: wlost .8s ease-in-out infinite; }
      /* Flash rouge brique sur les bords de l'écran quand le joueur est touché. */
      /* Traits de vitesse (D90) : rayons crème autour du centre, au-delà de 100 km/h ; l'opacité suit la vitesse. */
      #speedlines { position: fixed; inset: -12%; z-index: 2; pointer-events: none; opacity: 0; display: none;
                    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 248, 230, 0) 0deg 2.1deg, rgba(255, 248, 230, .8) 2.3deg 2.6deg, rgba(255, 248, 230, 0) 2.7deg 6.5deg);
                    -webkit-mask-image: radial-gradient(ellipse at center, transparent 40%, #000 78%); mask-image: radial-gradient(ellipse at center, transparent 40%, #000 78%); }
      #hurt { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0; box-shadow: inset 0 0 90px 24px rgba(217, 71, 43, .75); transition: opacity .5s ease-out; }
      #hurt.flash { opacity: 1; transition: none; }
      /* Arme en main (J5) : pictogramme dans une pastille crème, nom en petites capitales, munitions en ocre ; un appui passe à l'arme suivante. */
      #weapon { pointer-events: auto; padding: 0; }
      #weapon button { display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 12px; border: 0; background: none; color: var(--cream); cursor: pointer; font: inherit; }
      #weapon .wicon { width: 26px; height: 26px; border-radius: 50%; background: var(--cream); color: var(--ink); display: grid; place-items: center; font-size: 17px; }
      #weapon .wname { font: 800 11px/1 system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
      #weapon .wammo { font: 800 18px/1 system-ui, sans-serif; color: var(--ochre); font-variant-numeric: tabular-nums; }
      #weapon .wammo:empty { display: none; }
      #weapon .wammo small { font-size: 12px; font-weight: 700; color: rgba(255, 248, 230, .7); }
      #weapon.flash button { animation: wrise .45s ease-out; }
      body.layout #status { display: flex; }
      body.layout .slot { display: flex; min-width: 80px; outline: 1px dashed rgba(255, 255, 255, .55); border-radius: 8px; }
      body.layout .slot::before { content: attr(data-name); opacity: .7; font-weight: 400; font-size: 12px; }
      /* Pendant la pause, l'interface du jeu s'efface : le menu ou la carte prend tout l'écran. */
      body.paused #minimap, body.paused #clock, body.paused #status, body.paused #hurt, body.paused #speedlines,
      body.paused #action, body.paused #attack, body.paused #reload, body.paused #reticle, body.paused #pedals, body.paused #speedo, body.paused #stunt, body.paused #hint, body.paused #credits, body.paused #debug { visibility: hidden; }
      /* Arrestation (J4) et mort (J5) : un bandeau d'affiche rouge brique au milieu de l'écran, qui s'efface tout seul. */
      #busted { position: fixed; left: 0; right: 0; top: 34%; z-index: 8; display: none; flex-direction: column; align-items: center; gap: 6px; padding: 14px 0 16px;
                background: rgba(217, 71, 43, .92); color: #fff8e6; pointer-events: none; text-align: center; box-shadow: 0 6px 0 rgba(27, 31, 39, .55); }
      #busted.dead { background: rgba(27, 31, 39, .94); }
      #busted.show { display: flex; animation: busted 5s ease-in both; }
      #busted .b-title { font: 900 44px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
      #busted .b-sub { font: 600 15px system-ui, sans-serif; opacity: .95; }
      @keyframes busted { 0% { opacity: 0; transform: scaleY(.2); } 8%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      /* Menu pause */
      #pause { position: fixed; inset: 0; z-index: 20; display: flex; background: rgba(20, 17, 14, .9); color: #fff8e6; font: 15px system-ui, sans-serif;
               padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left)); gap: 14px; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: pan-y; }
      .pm-side { width: 210px; flex: none; display: flex; flex-direction: column; gap: 6px; }
      .pm-title { font: 700 22px system-ui, sans-serif; padding: 4px 6px 6px; letter-spacing: .02em; }
      .pm-item { text-align: left; padding: 0 14px; height: 44px; flex: none; border-radius: 12px; border: 1px solid rgba(255, 248, 230, .25); background: rgba(255, 248, 230, .08); color: inherit; font: 600 16px system-ui, sans-serif; }
      .pm-item.on { background: rgba(217, 71, 43, .85); border-color: #fff8e6; }
      .pm-content { flex: 1; overflow-y: auto; padding: 2px 6px 12px 2px; -webkit-overflow-scrolling: touch; }
      .pm-content h2 { margin: 2px 0 10px; font: 700 20px system-ui, sans-serif; }
      .pm-content p { margin: 0 0 10px; line-height: 1.4; }
      .pm-muted { opacity: .7; font-size: 13px; }
      .pm-warn { color: #ffd27a; }
      .pm-build { margin-top: 16px; }
      .pm-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 9px 0; border-bottom: 1px solid rgba(255, 248, 230, .14); }
      .pm-row.locked { opacity: .55; }
      .pm-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .pm-label small, .pm-note small, .pm-form-side small { opacity: .65; font-size: 12px; line-height: 1.3; }
      .pm-seg { display: flex; flex: none; border-radius: 10px; overflow: hidden; border: 1px solid rgba(255, 248, 230, .35); }
      .pm-seg button { min-width: 64px; height: 40px; padding: 0 10px; border: 0; background: rgba(255, 248, 230, .08); color: inherit; font: 600 14px system-ui, sans-serif; }
      .pm-seg button + button { border-left: 1px solid rgba(255, 248, 230, .25); }
      .pm-seg button.on { background: #d9472b; }
      .pm-seg button:disabled { opacity: .7; }
      .pm-slider { display: flex; align-items: center; gap: 10px; flex: none; }
      .pm-slider input { width: 170px; height: 40px; accent-color: #d9472b; }
      .pm-value { width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
      .pm-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
      .pm-actions button, .pm-note button, .bm-card button, .bm-chip button { height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255, 248, 230, .4); background: rgba(255, 248, 230, .1); color: inherit; font: 600 14px system-ui, sans-serif; }
      .pm-actions button:disabled { opacity: .4; }
      .pm-primary { background: #d9472b !important; border-color: #fff8e6 !important; }
      .pm-danger { background: rgba(140, 30, 20, .8) !important; }
      .pm-notes { display: flex; flex-direction: column; gap: 8px; }
      .pm-note { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 10px; background: rgba(255, 248, 230, .08); }
      .pm-note img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; flex: none; }
      .pm-note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; overflow-wrap: anywhere; }
      .pm-del { height: 34px !important; font-size: 12px !important; }
      .pm-form { display: flex; gap: 12px; align-items: flex-start; }
      .pm-shot { width: 280px; max-width: 42%; border-radius: 8px; flex: none; }
      .pm-form-side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .pm-form textarea, .pm-paste { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid rgba(255, 248, 230, .4); background: rgba(0, 0, 0, .35); color: #fff8e6; font: 15px system-ui, sans-serif; padding: 8px; user-select: text; -webkit-user-select: text; }
      .pm-paste { height: 90px; margin-top: 8px; }
      /* Écran Apparence : aperçu fixe à gauche, choix à droite (défilent avec le panneau). */
      .pm-appearance { display: flex; gap: 16px; align-items: flex-start; }
      .pm-preview { position: sticky; top: 0; flex: none; width: 190px; display: flex; flex-direction: column; gap: 8px; }
      .pm-preview .pm-actions { margin: 0; flex-wrap: nowrap; gap: 6px; }
      .pm-preview .pm-actions button { height: 38px; padding: 0 9px; font-size: 13px; white-space: nowrap; }
      .pm-controls { flex: 1; min-width: 0; }
      .pm-section { margin: 4px 0 6px; font: 700 15px system-ui, sans-serif; color: #f1b24a; letter-spacing: .02em; }
      .pm-section:not(:first-child) { margin-top: 18px; }
      .pm-arow { padding: 7px 0; border-bottom: 1px solid rgba(255, 248, 230, .12); }
      .pm-alabel { display: block; margin-bottom: 5px; font-size: 13px; opacity: .75; }
      .pm-chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .pm-chips button { height: 36px; padding: 0 11px; border-radius: 10px; border: 1px solid rgba(255, 248, 230, .3); background: rgba(255, 248, 230, .08); color: inherit; font: 600 13px system-ui, sans-serif; }
      .pm-chips button.on { background: #d9472b; border-color: #fff8e6; }
      .pm-swatches { display: flex; flex-wrap: wrap; gap: 8px; }
      .pm-sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255, 248, 230, .35); padding: 0; }
      .pm-sw.on { border-color: #fff8e6; box-shadow: 0 0 0 3px #d9472b; }
      /* Carte agrandie */
      #bigmap { position: fixed; inset: 0; z-index: 30; background: #f2e4c0; touch-action: none; user-select: none; -webkit-user-select: none; font-family: system-ui, sans-serif; }
      #bigmap canvas { position: absolute; inset: 0; touch-action: none; }
      .bm-btn { position: absolute; z-index: 2; height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid rgba(255, 248, 230, .8); background: rgba(43, 33, 24, .82); color: #fff8e6; font: 600 15px system-ui, sans-serif; }
      .bm-resume { left: max(10px, env(safe-area-inset-left)); top: 10px; border-color: var(--ink); background: var(--brick); font-weight: 800; }
      .bm-menu { right: max(10px, env(safe-area-inset-right)); top: 10px; font-weight: 800; }
      .bm-filter { right: calc(max(10px, env(safe-area-inset-right)) + 104px); top: 10px; }
      .bm-here { left: max(10px, env(safe-area-inset-left)); bottom: 12px; font-size: 22px; }
      .bm-zoom-in { right: max(10px, env(safe-area-inset-right)); bottom: 12px; font-size: 24px; }
      .bm-zoom-out { right: calc(max(10px, env(safe-area-inset-right)) + 54px); bottom: 12px; font-size: 24px; }
      .bm-filters { position: absolute; z-index: 3; right: max(10px, env(safe-area-inset-right)); top: 62px; display: grid; grid-template-columns: auto auto; gap: 0 18px; padding: 8px 14px; border-radius: 12px; background: rgba(43, 33, 24, .92); color: #fff8e6; font-size: 15px; }
      .bm-filters label { display: flex; align-items: center; gap: 8px; height: 36px; }
      .bm-filters input { width: 20px; height: 20px; accent-color: #d9472b; }
      .bm-chip { position: absolute; z-index: 2; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; height: 44px; border-radius: 12px; background: rgba(217, 71, 43, .94); color: #fff8e6; font: 600 15px system-ui, sans-serif; white-space: nowrap; }
      .bm-chip button { height: 34px; }
      .bm-card { position: absolute; z-index: 2; left: 50%; bottom: 12px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 3px; align-items: flex-start; min-width: 240px; max-width: 46%; padding: 10px 14px; border-radius: 12px; background: rgba(43, 33, 24, .93); color: #fff8e6; font-size: 14px; }
      .bm-card span, .bm-card em { opacity: .8; font-size: 13px; }
      .bm-credit { position: absolute; z-index: 1; left: calc(max(10px, env(safe-area-inset-left)) + 54px); bottom: 4px; font-size: 10px; color: rgba(43, 33, 24, .75); pointer-events: none; }
      .bm-hint { position: absolute; z-index: 1; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 10px; background: rgba(43, 33, 24, .72); color: #fff8e6; font-size: 13px; white-space: nowrap; pointer-events: none; opacity: 0; }
      .bm-hint.fade { animation: hint 7s ease-out 0.3s both; }
    </style>
  </head>

    <canvas id="game"></canvas>
    <div id="touch"></div>
    <div id="stick-base"></div><div id="stick-knob"></div>

    <div id="clock" aria-label="Heure du jeu">--:--</div>
    <div id="status"><div id="health" class="slot" data-name="santé"></div><div id="weapon" class="slot" data-name="arme"></div><div id="wanted" class="slot" data-name="recherche"></div></div>
    <div id="hint">Pouce gauche : marcher (à fond : courir) · glisser à droite : regarder · toucher la minimap : carte et pause</div>
    <div id="pedals"><div id="horn" class="pedal" role="button" aria-label="Klaxon"></div><div id="handbrake" class="pedal" role="button" aria-label="Frein à main"></div><div id="brake" class="pedal" role="button" aria-label="Frein"></div><div id="gas" class="pedal" role="button" aria-label="Accélérer"></div></div>
    <div id="stunt" aria-live="polite"></div>
    <div id="speedo" aria-label="Vitesse"><svg viewBox="0 0 72 72"><circle class="disc" cx="36" cy="36" r="34"/><path class="track" pathLength="100" d="M 16.2 55.8 A 28 28 0 1 1 55.8 55.8"/><path id="speedo-arc" pathLength="100" d="M 16.2 55.8 A 28 28 0 1 1 55.8 55.8"/></svg><div id="speedo-value">0</div><div id="speedo-unit">km/h</div></div>

    <div id="attack" role="button" aria-label="Frapper"></div>
    <button id="reload" title="Recharger" aria-label="Recharger"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg></button>
    <button id="action"></button>
    <div id="speedlines"></div>
    <div id="hurt"></div>
    <div id="busted" aria-live="polite"><div class="b-title">Arrêté</div><div class="b-sub"></div></div>
    <div id="debug"></div>
    <div id="loading">Chargement d'Autun…</div>
    <div id="credits">© contributeurs OpenStreetMap · IGN (BD TOPO®, LiDAR HD, BD ORTHO®, Parcellaire Express) · three.js</div>
