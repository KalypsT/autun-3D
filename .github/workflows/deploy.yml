name: Publier sur GitHub Pages

# Gardé jusqu'à la bascule vers DomoThib Games (D305), puis supprimé avec GitHub Pages. Les vérifications (lint, types, tests) sont
# faites par domothib.yml, sur chaque PR et sur main : ce workflow ne fait plus que construire (chemins relatifs) et publier.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# La publication n'est jamais annulée, sinon le site reste sur l'ancienne version.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
